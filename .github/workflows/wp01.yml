name: WP-01 and LX-01 witness

on:
  workflow_dispatch:
    inputs:
      dense:
        description: Run E5, SciFact and the vector witness
        type: boolean
        default: false
      vectors_commit:
        description: Optional commit containing a precomputed E5 train and corpus bundle
        type: string
        required: false
      scifact:
        description: Run the full SciFact experiment after the dense witness
        type: boolean
        default: true
      stability:
        description: Measure four fresh E5 HNSW graphs using the recorded SciFact vectors
        type: boolean
        default: false
      gemma_vectors_commit:
        description: Optional commit containing the Gemma SciFact vectors for a paired stability run
        type: string
        required: false

permissions:
  contents: read

jobs:
  witness:
    if: "!inputs.stability"
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.dense && 120 || 20 }}
    env:
      COMPOSE_PROJECT_NAME: wp01
      COMPOSE_FILE: infra/postgres/compose.cpu.yaml:infra/vespa/compose.witness.yaml
      RETRIEVAL_LAB_PG_PORT: "15432"
      RETRIEVAL_LAB_VESPA_PORT: "18080"
      RETRIEVAL_LAB_CONFIG_PORT: "19071"
      WITNESS_VESPA_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Install and test the Python package
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r config/requirements-cpu-linux-amd64.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -B -m unittest discover -s tests/unit -v
          python -B -m unittest discover -s tests/contract -v
      - name: Start the pinned services and check feed and search
        run: |
          evidence="$RUNNER_TEMP/wp01"
          mkdir -p "$evidence"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "RETRIEVAL_LAB_PASSWORD=$password" >> "$GITHUB_ENV"
          export RETRIEVAL_LAB_PASSWORD="$password"
          docker info --format 'CPUs={{.NCPU}} RAM_bytes={{.MemTotal}}' | tee "$evidence/docker-host.txt"
          docker compose config --images | tee "$evidence/images.txt"
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          sudo df -h "$docker_root" | tee "$evidence/disk-before.txt"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          fi
          docker compose pull
          sudo df -h "$docker_root" | tee "$evidence/disk-after-pull.txt"
          disk_used=$(sudo df -P "$docker_root" | awk 'NR == 2 { sub(/%$/, "", $5); print $5 }')
          if ((disk_used > 75)); then
            echo "Docker disk use is ${disk_used}% after pulling images. The witness requires at most 75% before startup." >&2
            exit 1
          fi
          docker compose up --detach --wait --wait-timeout 90 --pull never
          config_url="http://127.0.0.1:$RETRIEVAL_LAB_CONFIG_PORT"
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-all-errors \
            --retry-delay 3 --retry-max-time 150 --output "$evidence/tenants.json" "$config_url/application/v2/tenant"
          python -B infra/vespa/deploy.py "$config_url" | tee "$evidence/deploy.json"
          jq -e '.activated == true' "$evidence/deploy.json" > /dev/null
          curl --fail-with-body --silent --show-error --max-time 8 --retry 30 --retry-all-errors \
            --retry-delay 3 --retry-max-time 150 --header 'Content-Type: application/json' \
            --data-binary '{"fields":{"tenant":"wp01-probe","generation":"wp01-probe","projection_id":"wp01-probe","fragment_id":"wp01-probe","digest":"wp01-probe","body":"WP-01 readiness probe"}}' \
            --output "$evidence/feed-probe.json" "$WITNESS_VESPA_URL/document/v1/lab/fragment/docid/wp01-probe"
          deadline=$((SECONDS + 75))
          while ! curl --fail --silent --max-time 4 --get "$WITNESS_VESPA_URL/search/" \
              --data-urlencode 'yql=select fragment_id from fragment where tenant contains "wp01-probe"' \
              --data-urlencode 'hits=1' > "$evidence/search-probe.json" ||
            ! jq -e '.root.coverage.full == true and any(.root.children[]?; .fields.fragment_id == "wp01-probe")' \
              "$evidence/search-probe.json" > /dev/null; do
            if ((SECONDS >= deadline)); then
              echo "The readiness document did not appear with full coverage" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Run WP-01 against PostgreSQL and Vespa
        run: |
          evidence="$RUNNER_TEMP/wp01"
          export ACCEPT_REVISION_TEST_DSN="postgresql://postgres:$RETRIEVAL_LAB_PASSWORD@127.0.0.1:$RETRIEVAL_LAB_PG_PORT/retrieval_lab"
          settings=$(docker compose exec -T postgres psql -XAt -U postgres -d retrieval_lab \
            -c "SELECT current_setting('server_version_num'), current_setting('fsync'), current_setting('synchronous_commit'), current_setting('full_page_writes')")
          echo "$settings" | tee "$evidence/postgres-settings.txt"
          test "$settings" = "170011|on|on|on"
          python -B -m unittest discover -s tests/integration -p test_witness_pipeline.py -k test_wp01 -v \
            2>&1 | tee "$evidence/wp01.log"
          grep -q '^Ran 1 test in ' "$evidence/wp01.log"
          grep -qx 'OK' "$evidence/wp01.log"
      - name: Record the LX-01 lexical baseline
        run: |
          evidence="$RUNNER_TEMP/wp01"
          docker compose exec -T postgres createdb -U postgres retrieval_lexical
          for migration in infra/postgres/migrations/*.sql; do
            docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d retrieval_lexical < "$migration"
          done
          export INGESTION_DSN="postgresql://postgres:$RETRIEVAL_LAB_PASSWORD@127.0.0.1:$RETRIEVAL_LAB_PG_PORT/retrieval_lexical"
          export INGESTION_OBJECTS
          INGESTION_OBJECTS=$(mktemp -d "$RUNNER_TEMP/wp01-objects.XXXXXX")
          python -B -m search_retrieval.lab replay evaluation/fixtures/witness-feed.json evaluation/fixtures/witness.json \
            | tee "$evidence/replay.log"
          python -B -m search_retrieval.lab publish | tee "$evidence/publish.log"
          python -B evaluation/vespa_lexical.py evaluation/fixtures/lexical-probes.json "$evidence/lx01"
      - name: Verify dense and hybrid withdrawal in the real witness
        if: inputs.dense
        run: |
          evidence="$RUNNER_TEMP/wp01"
          export ACCEPT_REVISION_TEST_DSN="postgresql://postgres:$RETRIEVAL_LAB_PASSWORD@127.0.0.1:$RETRIEVAL_LAB_PG_PORT/retrieval_lab"
          python -B -m unittest discover -s tests/integration -p test_witness_pipeline.py -k test_vector -v \
            2>&1 | tee "$evidence/vector-withdrawal.log"
          grep -q '^Ran 2 tests in ' "$evidence/vector-withdrawal.log"
          grep -qx 'OK' "$evidence/vector-withdrawal.log"
      - name: Install pinned evaluation dependencies and materialize E5
        if: inputs.dense
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r config/requirements-dense-linux-amd64.lock
          python -m pip check
          python -B -m unittest discover -s evaluation -p test_scifact_dense.py -v
          mkdir -p "$RUNNER_TEMP/scifact"
          python -B -c 'import sys; from pathlib import Path; sys.path.insert(0,"evaluation"); from scifact_embeddings import materialize; root=Path(sys.argv[1]); materialize(root/"model",root/"scifact.zip")' "$RUNNER_TEMP/scifact"
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/scifact/beir.zip" \
            https://codeload.github.com/beir-cellar/beir/zip/ef83d29307061c65d04b035b4f4e7c18bd8374af
      - name: Validate the optional embedding bundle reference
        if: inputs.dense && inputs.vectors_commit != ''
        env:
          VECTORS_COMMIT: ${{ inputs.vectors_commit }}
        run: '[[ "$VECTORS_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - name: Fetch precomputed embeddings from the private repository
        if: inputs.dense && inputs.vectors_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.vectors_commit }}
          path: scifact-vector-input
      - name: Measure vector and hybrid service with warm E5 and cold query inputs
        if: inputs.dense
        run: |
          evidence="$RUNNER_TEMP/wp01"
          docker compose exec -T postgres createdb -U postgres retrieval_vector
          for migration in infra/postgres/migrations/*.sql; do
            docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d retrieval_vector < "$migration"
          done
          docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U postgres -d retrieval_vector \
            -c "UPDATE retrieval_generation SET active = 'witness-e5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"
          export INGESTION_DSN="postgresql://postgres:$RETRIEVAL_LAB_PASSWORD@127.0.0.1:$RETRIEVAL_LAB_PG_PORT/retrieval_vector"
          export INGESTION_OBJECTS
          INGESTION_OBJECTS=$(mktemp -d "$RUNNER_TEMP/vector-objects.XXXXXX")
          python -B -m search_retrieval.lab replay evaluation/fixtures/witness-feed.json evaluation/fixtures/witness.json
          HF_HUB_OFFLINE=1 python -B evaluation/vespa_vector.py "$RUNNER_TEMP/scifact/model" \
            evaluation/fixtures/lexical-probes.json "$evidence/vector-service"
      - name: Encode SciFact and run the frozen five-ranking comparison
        if: inputs.dense && inputs.scifact
        env:
          HF_HUB_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          OPENBLAS_NUM_THREADS: "1"
          VECTORS_COMMIT: ${{ inputs.vectors_commit }}
        run: |
          assets="$RUNNER_TEMP/scifact"
          evidence="$RUNNER_TEMP/wp01"
          if [[ -n "$VECTORS_COMMIT" ]]; then
            mkdir "$evidence/embeddings"
            archive="scifact-vector-input/scifact-e5-vectors.tar.gz"
            sha256sum "$archive" > "$evidence/vector-bundle-sha256.txt"
            tar -xzf "$archive" -C "$evidence/embeddings" --no-same-owner --no-same-permissions \
              conformance.json environment.json corpus.json corpus.npy train.json train.npy
            echo "$VECTORS_COMMIT" > "$evidence/vector-bundle-commit.txt"
          else
            python -u -B evaluation/scifact_embeddings.py "$assets/model" "$assets/scifact.zip" "$evidence/embeddings" --threads 2
          fi
          python -u -B evaluation/scifact_dense.py "$assets/model" "$assets/scifact.zip" \
            "$evidence/embeddings" "$assets/beir.zip" "$evidence/scifact" --threads 2
      - name: Collect service logs and remove the lab
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/wp01"
          if [[ -n "${RETRIEVAL_LAB_PASSWORD:-}" ]]; then
            timeout 30s docker compose logs --no-color > "$RUNNER_TEMP/wp01/services.log" 2>&1 || true
            timeout 45s docker compose down --volumes
          fi
      - name: Upload witness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp01-witness
          path: ${{ runner.temp }}/wp01
          retention-days: 7
  stability:
    if: inputs.stability
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.gemma_vectors_commit != '' && 65 || 35 }}
    permissions:
      actions: read
      contents: read
    env:
      COMPOSE_FILE: infra/vespa/compose.witness.yaml
      RETRIEVAL_LAB_VESPA_PORT: "18080"
      RETRIEVAL_LAB_CONFIG_PORT: "19071"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - name: Verify locked tools and retrieve recorded inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r config/requirements-cpu-linux-amd64.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install --require-hashes --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu -r config/requirements-dense-linux-amd64.lock
          python -B -m unittest discover -s tests/unit -v
          python -B -m unittest discover -s tests/contract -v
          python -B -m unittest discover -s evaluation -p 'test_scifact*.py' -v
          mkdir -p "$RUNNER_TEMP/stability" "$RUNNER_TEMP/assets"
          gh run download 42275419629 --repo "$GITHUB_REPOSITORY" -n wp01-witness --dir "$RUNNER_TEMP/assets"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/assets/scifact.zip" https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/assets/beir.zip" https://codeload.github.com/beir-cellar/beir/zip/ef83d29307061c65d04b035b4f4e7c18bd8374af
      - name: Validate the optional Gemma vectors commit
        if: inputs.gemma_vectors_commit != ''
        env:
          GEMMA_COMMIT: ${{ inputs.gemma_vectors_commit }}
        run: '[[ "$GEMMA_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - name: Fetch the optional Gemma vectors from the private repository
        if: inputs.gemma_vectors_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.gemma_vectors_commit }}
          path: scifact-gemma-vector-input
      - name: Verify and unpack the Gemma vectors
        if: inputs.gemma_vectors_commit != ''
        run: |
          archive="scifact-gemma-vector-input/scifact-gemma-vectors.tar.gz"
          sha256sum "$archive" > "$RUNNER_TEMP/stability/gemma-bundle-sha256.txt"
          python -B - "$archive" "$RUNNER_TEMP/assets/gemma" <<'PY'
          import sys
          import tarfile

          expected = {
              "train/environment.json", "train/conformance.json",
              "train/corpus.json", "train/corpus.npy", "train/train.json", "train/train.npy",
              "test/test.json", "test/test.npy",
          }
          with tarfile.open(sys.argv[1]) as source:
              entries = source.getmembers()
              if {entry.name for entry in entries} != expected or len(entries) != len(expected):
                  raise ValueError("Unexpected Gemma vector bundle layout")
              if not all(entry.isfile() for entry in entries):
                  raise ValueError("Gemma bundle entries must be regular files")
              source.extractall(sys.argv[2], filter="data")
          PY
      - name: Build and measure four isolated graphs per encoder
        run: |
          assets="$RUNNER_TEMP/assets"
          evidence="$RUNNER_TEMP/stability"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          fi
          docker compose pull
          docker info --format 'CPUs={{.NCPU}} RAM_bytes={{.MemTotal}}' > "$evidence/docker-host.txt"
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          disk_used=$(sudo df -P "$docker_root" | awk 'NR == 2 { sub(/%$/, "", $5); print $5 }')
          if ((disk_used > 75)); then
            echo "Vespa test runner requires no more than 75% disk use before starting." >&2
            exit 1
          fi
          config=http://127.0.0.1:19071
          search=http://127.0.0.1:18080
          cleanup() { docker compose down --volumes; }
          trap cleanup EXIT
          models=(e5)
          if [[ -d "$assets/gemma" ]]; then models+=(gemma); fi
          seed_index=0
          for seed in $(jq -r '.insertion_order_seeds[]' config/scifact-stability-v1.json); do
            order=("${models[@]}")
            if [[ ${#models[@]} == 2 && $((seed_index % 2)) == 1 ]]; then order=(gemma e5); fi
            seed_index=$((seed_index + 1))
            for model in "${order[@]}"; do
              if [[ "$model" == e5 ]]; then
                train="$assets/embeddings"
                test="$assets/scifact"
                prefix=""
              else
                train="$assets/gemma/train"
                test="$assets/gemma/test"
                prefix="gemma-"
              fi
              export COMPOSE_PROJECT_NAME="stability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$model-$seed"
              docker compose up -d --pull never
              curl -fsS --max-time 5 --retry 30 --retry-all-errors --retry-delay 3 --retry-max-time 150 "$config/application/v2/tenant" >/dev/null
              python -B infra/vespa/deploy.py "$config" > "$evidence/${prefix}deploy-$seed.json"
              deadline=$((SECONDS + 90))
              until curl -fsS --max-time 4 -G --data-urlencode 'yql=select projection_id from fragment where true' --data-urlencode 'hits=0' "$search/search/" \
                | jq -e '.root.coverage.full == true and .root.fields.totalCount == 0' >/dev/null; do
                if ((SECONDS >= deadline)); then exit 1; fi
                sleep 2
              done
              python -u -B evaluation/scifact_stability.py run "$assets/scifact.zip" "$train" \
                "$test" "$assets/beir.zip" "$evidence/${prefix}seed-$seed" --vespa "$search" --seed "$seed"
              cleanup
            done
          done
          python -B evaluation/scifact_stability.py aggregate "$evidence/aggregate.json" "$evidence"/*seed-*/manifest.json
      - name: Upload stability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scifact-stability
          path: ${{ runner.temp }}/stability
          retention-days: 7
