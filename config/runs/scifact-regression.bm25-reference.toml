# In-process BM25 reference on the spent SciFact test split. Pipeline regression only.
[run]
id = "scifact-regression.bm25-reference"
code_commit = "b03e9dcc2ac85debcbdb3845798718c6cc02ceb6"
split = "regression"

[corpus]
manifest = "manifests/corpus/beir-scifact.json"

[transform]
manifest = "manifests/transform/beir-title-space-text-v1.json"

[index]
engine = "in-process"
schema_revision = "none"
lexical = { k1 = 1.2, b = 0.75, tokenizer = "unicode-word-casefold" }

[ranking]
profile = "bm25-reference"
target_hits = 100
fusion = { kind = "none" }

[queries]
set = "beir/scifact/test"
judgments = "human"
manifest = "manifests/queries/beir-scifact-test.json"

[runtime]
manifest = "manifests/runtime/bench-win64.json"
