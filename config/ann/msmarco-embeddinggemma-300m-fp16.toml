# Step 4 of the workbench: exact oracle and ANN sweeps over MS MARCO passage (8,841,823
# documents) with EmbeddingGemma stored in float16, and the 6,980 dev queries.
#
# Oracle: FAISS flat on GPU, certified in float64, for five selectivity cohorts.
# Sweeps: FAISS on CPU. "grid" spans M x efConstruction with one insertion order; "orders"
# repeats M = 16, efConstruction = 200 with three orders, the gate of step 4. Its seed-11 build
# duplicates one grid build: comparing their structure digests shows whether a multithreaded
# build is reproducible. "lowmem" is the IVF-PQ point of low memory.
#
# The search depth is 100, so ef_search starts at 100.

[inputs]
space = "manifests/space/embeddinggemma-300m-fp16.json"
corpus = "manifests/corpus/msmarco-v1-passage-text.json"
transform = "manifests/transform/passage-identity-v1.json"
queries = "manifests/queries/msmarco-passage-dev-small.json"

[oracle]
k = 100
initial_candidates = 200
query_batch = 1024
cohorts_permille = [1000, 500, 100, 10, 1]

[measure]
recall_at = [10, 100]
search_threads = 0
build_threads = 0
timing_repeats = 3
warmup = 1
add_batch = 65536

[[hnsw]]
name = "grid"
m = [16, 32, 48]
ef_construction = [200, 400]
insertion_seeds = [11]
ef_search = [100, 128, 192, 256, 384, 512, 768, 1024]
cohorts_permille = [1000]

[[hnsw]]
name = "orders"
m = [16]
ef_construction = [200]
insertion_seeds = [11, 29, 47]
ef_search = [100, 128, 192, 256, 384, 512, 768, 1024]
cohorts_permille = [1000, 500, 100, 10, 1]

[[ivfpq]]
name = "lowmem"
nlist = [16384]
pq_m = [96]
nbits = 8
train_size = 640000
train_seed = 11
insertion_seeds = [11]
nprobe = [1, 2, 4, 8, 16, 32, 64, 128, 256]
cohorts_permille = [1000]
